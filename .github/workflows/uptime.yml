name: Uptime

# Checks the live sites every 10 minutes. Set the repository variable UPTIME_URLS
# (Settings → Secrets and variables → Actions → Variables) to a space-separated list, e.g.
#   https://gnkconnect.com https://portal.gnkconnect.com https://api.gnkconnect.com/api/v1/health
# When a check fails an "outage" issue is opened (GitHub notifies watchers); it is closed
# automatically once everything is back up.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    if: vars.UPTIME_URLS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check URLs
        id: check
        env:
          URLS: ${{ vars.UPTIME_URLS }}
        run: |
          failed=""
          for url in $URLS; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 "$url" || true)
            echo "$url → $code"
            case "$code" in 2*|3*) ;; *) failed="$failed\n- $url → HTTP $code" ;; esac
          done
          if [ -n "$failed" ]; then
            {
              echo 'failed<<EOF'
              printf "%b\n" "$failed"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the outage issue
        if: steps.check.outputs.failed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          body=$(printf "Uptime check failed at %s UTC:\n%s\n\nRun: %s/%s/actions/runs/%s" \
            "$(date -u '+%Y-%m-%d %H:%M')" "$FAILED" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label outage --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create outage -R "$GITHUB_REPOSITORY" --color B60205 --force >/dev/null
            gh issue create -R "$GITHUB_REPOSITORY" --title "Site down" --label outage --body "$body"
          fi
          exit 1

      - name: Close the outage issue when everything is back
        if: steps.check.outputs.failed == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label outage --state open --json number -q '.[].number'); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Back up at $(date -u '+%Y-%m-%d %H:%M') UTC."
          done
