version: '3.8'

services:
  # ---------------- PostgreSQL Database ---------------- #
  postgres:
    image: postgres:16-alpine
    container_name: gnk_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gnk_admin -d gnk_connect_db']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gnk_network

  # ---------------- Redis In-Memory Cache ---------------- #
  redis:
    image: redis:7-alpine
    container_name: gnk_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gnk_network

  # ---------------- NestJS Enterprise Backend API ---------------- #
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gnk_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AIRDESK_API_URL: ${AIRDESK_API_URL}
      AIRDESK_API_KEY: ${AIRDESK_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '${API_PORT:-4010}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gnk_network

  # ---------------- Admin Operations Center ---------------- #
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: gnk_admin
    restart: always
    ports:
      - '${ADMIN_PORT:-3012}:80'
    environment:
      VITE_API_URL: http://localhost:4010/api/v1
    depends_on:
      - api
    networks:
      - gnk_network

  # ---------------- B2B Agent Portal ---------------- #
  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    container_name: gnk_portal
    restart: always
    ports:
      - '${PORTAL_PORT:-3011}:80'
    environment:
      VITE_API_URL: http://localhost:4010/api/v1
    depends_on:
      - api
    networks:
      - gnk_network

  # ---------------- Customer Travel Website ---------------- #
  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    container_name: gnk_website
    restart: always
    ports:
      - '${WEBSITE_PORT:-3010}:80'
    environment:
      VITE_API_URL: http://localhost:4010/api/v1
    depends_on:
      - api
    networks:
      - gnk_network

  # ---------------- MinIO Object Storage ---------------- #
  minio:
    image: minio/minio:latest
    container_name: gnk_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecret123}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - gnk_network

  # ---------------- Mailpit Email Testing ---------------- #
  mailpit:
    image: axllent/mailpit
    container_name: gnk_mailpit
    restart: always
    ports:
      - '8025:8025'
      - '1025:1025'
    networks:
      - gnk_network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

networks:
  gnk_network:
    driver: bridge
